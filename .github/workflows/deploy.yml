name: Deploy to 1984 Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync Theme and Plugins via SFTP
        env:
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "leila@101demands.org","$SFTP_PASS" sftp://audrey.shared.1984.is:2222 <<'EOF'
          set sftp:auto-confirm yes
          set net:timeout 15
          set net:max-retries 2
          set cmd:fail-exit yes
          mirror -R --verbose 101demands-rebel-theme/ /htdocs/wp-content/themes/101demands-rebel-theme/
          mirror -R --verbose plugins/ /htdocs/wp-content/plugins/
          bye
          EOF
